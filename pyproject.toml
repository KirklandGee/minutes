[project]
name = "minutes"
version = "0.1.0"
description = "Local-first meeting recorder for Linux: auto-detects calls, transcribes on-device, writes Markdown."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kirkland Gee" }]
requires-python = ">=3.11"
dependencies = ["faster-whisper>=1.1"]
keywords = ["meetings", "transcription", "whisper", "pipewire", "linux"]

[project.urls]
Repository = "https://github.com/KirklandGee/minutes"

[project.scripts]
minutes = "minutes.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
